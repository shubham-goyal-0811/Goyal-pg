# Backup keep-alive for the free-tier backend and database.
#
# The backend pings itself every 10 minutes (backend/jobs/keepAlive.js), but a
# server that has already gone to sleep can't wake itself. This wakes it from
# outside and, through /health/db, touches the database as well.
#
# GitHub runs scheduled workflows only from the default branch, often a few
# minutes late, and turns them off after 60 days without a commit to the repo.
# Re-enable it from the Actions tab if that happens.
name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend and database
        env:
          # Set a repository variable named BACKEND_URL to point somewhere else.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://goyal-pg.onrender.com' }}
        run: |
          # A sleeping Render server takes up to a minute to start, so allow
          # a long first wait and a few retries before calling it a failure.
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
            "$BACKEND_URL/health/db"
